[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "roi-replicates"
version = "0.1.1"
description = "Traceable area-to-diameter conversion and replicate-aware ImageJ measurement summaries"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Master-626"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = []

[project.scripts]
roi-replicates = "roi_replicates.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
roi_replicates = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 110
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "W"]

[tool.ruff.lint.isort]
known-first-party = ["roi_replicates"]
